# Configuration
STATIONARY_HOST: "central.example.org"  # Replace with the static IP of the stationary host
SSH_PORT: 22
USERNAME: "vandaq"         # Replace with your SSH username
PRIVATE_KEY_PATH: "/home/vandaq/.ssh/id_central"  # Path to your SSH private key
SUBMIT_FILE_PATTERN: "submit_*.sbm"
DATA_DIR: "/home/vandaq/vandaq/collector/submission/"         # Directory containing files to transfer
ARCHIVE_DIR: "/home/vandaq/vandaq/collector/submission/submitted"  # Directory to move files after transfer
REMOTE_PATH: "/home/vandaq/vandaq/collector/submission/"
PING_HOST: "central.example.org"              # Host to ping for network check
CHECK_INTERVAL: 10                # Time in seconds to wait between checks

logs:
  log_dir: "/home/vandaq/vandaq/submitter/log"
  log_file: "submitter.log"
  log_level: "INFO"
  logger_name: "submitter"

