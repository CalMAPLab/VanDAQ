[project]
name = "vandaq"
version = "1.1.0"
description = "VanDAQ mobile atmospheric data acquisition"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "SQLAlchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pynmea2>=1.19",
    "pyserial>=3.5",
    "pyzmq>=25.0",
    "ipcqueue>=0.9",
    "pytz>=2024.1",
    "psutil>=5.9",
    "paramiko>=3.4",
    "dash>=3.0",
    "plotly>=5.24",
    "dash-bootstrap-components>=1.6",
    "dash-leaflet>=1.0.15",
    "dash-extensions>=1.0",
    "transitions>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
]
hardware = [
    "Phidget22>=1.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["common", "acquirer", "collector", "submitter"]
markers = [
    "integration: needs PostgreSQL or POSIX message queue",
    "hardware: needs serial, LabJack, or Phidget hardware",
]
addopts = "-ra --strict-markers"
norecursedirs = ["env", ".git", "htmlcov", "data", "scripts"]
